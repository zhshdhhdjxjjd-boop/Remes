<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="theme-color" content="#081633"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>منصة ريميس</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--a:#2459d8;--a2:#6ea3ff;--bg:#081633;--bg2:#0d1f45;--i:#e8eeff;--g:#f5b301;--s:#132a5c;--l:#27458a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
::selection{background:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--i);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--s);color:var(--i);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
.pri{background:var(--a);color:#fff}.dg{background:#4a1d2e;color:#fca5a5}.on{background:var(--a);color:#fff}.gl{background:#fef08a;color:#854d0e}
input{font:inherit;width:100%;padding:12px;border:2px solid var(--l);border-radius:12px;margin:6px 0;background:var(--bg2);color:var(--i)}
select{background:var(--bg2);color:var(--i);border:2px solid var(--l);border-radius:8px}
#app{display:flex;height:100%}
nav{width:70px;background:var(--s);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-left:1px solid var(--l)}
nav button{background:none;width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 2px;color:inherit}
nav button.on{background:var(--a);color:#fff}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow:auto;padding:20px;max-width:820px}
h1{font-size:34px;font-weight:900;margin:8px 0}h3{font-size:20px;font-weight:700;margin:14px 0 8px}
.cn{display:inline-block;color:#fde68a;background:#3a2e0a;border:2px solid var(--g);border-radius:20px;padding:4px 14px;font-weight:700;margin:4px}
.co{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--g);border:2px solid #b45309;vertical-align:-2px;margin:0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.cd{border:2px solid var(--l);border-radius:16px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.cd b{font-size:17px}.chip{width:42px;height:42px;border-radius:12px;display:inline-block;vertical-align:middle;background-size:cover;background-position:center}
#v{width:100%;height:54vh;min-height:300px;border:3px solid var(--l);border-radius:12px;overflow:hidden;touch-action:none;background:#0d1f45;position:relative}
#v canvas{display:block}
#fs{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:99}
#fs>div:first-child{flex:1;position:relative}#fs>div:first-child>*{position:absolute;inset:0}
#fs button{position:absolute;top:20px;right:20px;z-index:100;width:50px;height:50px;padding:0;border-radius:50%;background:var(--a);color:white}
.dp{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:12px 0;direction:ltr}
.dp button{height:56px}
#au{margin:auto;width:min(360px,92%);text-align:center}
#au h1{font-size:56px;color:var(--a2);margin-bottom:0}
#ld{position:fixed;inset:0;background:#081633e6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;font-weight:700}
.sp{width:70px;height:70px;position:relative}
.sp i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--a2);box-shadow:0 0 12px var(--a2);animation:o 1.5s ease-in-out infinite}
.sp i:nth-child(2){background:var(--g);box-shadow:0 0 12px var(--g);animation-delay:-.5s}
.sp i:nth-child(3){background:#fff;box-shadow:0 0 12px #fff;animation-delay:-1s}
@keyframes o{0%{transform:rotate(0) translateY(-28px) scale(1)}50%{transform:rotate(180deg) translateY(-28px) scale(.55)}100%{transform:rotate(360deg) translateY(-28px) scale(1)}}
#ts{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:var(--a);color:#fff;padding:10px 18px;border-radius:20px;transition:.3s;z-index:10;max-width:90%}
#ts.s{transform:translate(-50%,0)}
.bd{border:2px solid var(--l);border-radius:12px;padding:10px;margin:8px 0;background:var(--s)}
.bd input{margin:4px 0;font-size:13px}
#boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:200;font-weight:900;font-size:28px;color:var(--a2)}
#boot.h{display:none}
.pb{width:min(260px,70%);height:8px;border-radius:8px;background:var(--l);overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--a);animation:pb 10s linear forwards}
@keyframes pb{to{width:100%}}
.full{position:fixed!important;inset:0;width:100%!important;height:100%!important;max-width:none;z-index:50;border-radius:0!important;border:0!important}
#bo{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:8}#bo.s{display:flex}
.bh{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--l)}
#bo.imm .bh{position:absolute;top:0;left:0;right:0;border:0;pointer-events:none;z-index:2}#bo.imm .bh>*{pointer-events:auto}#bo.imm #bt{visibility:hidden}
#bo iframe{flex:1;border:0;width:100%;background:#fff}
textarea{font:13px/1.5 ui-monospace,monospace;width:100%;min-height:200px;padding:12px;border:2px solid var(--l);border-radius:12px;direction:ltr;background:var(--bg2);color:var(--i);-webkit-user-select:text;user-select:text;margin:6px 0}
textarea,input{-webkit-touch-callout:default}textarea::selection,input::selection{background:#3b82f6}
.ni{width:62px;padding:6px;margin:2px;font-size:12px;text-align:center}
nav{overflow-y:auto}
.gi{width:90px;margin:0;padding:8px}
.fx{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:5;width:44px;height:44px;border-radius:50%;padding:0;background:var(--a);color:#fff;font-size:26px}
.nt{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline-start:14px;max-width:min(300px,70%);font-size:12px;font-weight:400;color:#8ea4d6;line-height:1.6;text-align:start}
@media(prefers-reduced-motion:reduce){.sp i{animation-duration:3s}}
main:has(.vg){max-width:none}.vg{margin:-20px;padding:20px;min-height:100%;background:#0e2557}.vg .bd{background:var(--s)}.eg button{font-size:14px;padding:8px 12px;margin:2px}.vs{width:36px;height:36px;border-radius:50%;padding:0}
#ad{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:60}#ad.s{display:flex}#ad>div{width:min(420px,92%);height:min(560px,80%);background:var(--bg2);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}#ad iframe{flex:1;border:0}.ah{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--l)}
#js{width:130px;height:130px;border-radius:50%;border:3px solid var(--l);background:#ffffff1f;position:relative;touch-action:none}#js i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:var(--a)}#jb{width:90px;height:90px;border-radius:50%;font-size:18px;touch-action:none}
#lg{position:fixed;top:calc(4px + env(safe-area-inset-top,0px));left:4px;width:120px;height:auto;filter:drop-shadow(0 3px 8px #000a);z-index:6;pointer-events:none}
@media(min-width:700px){#lg{width:150px}}
#ck{position:fixed;inset:0;background:#081633ee;display:none;align-items:center;justify-content:center;z-index:150;padding:16px}
#ck.s{display:flex}
#ck>div{width:min(440px,100%);max-height:92%;overflow:auto;background:var(--bg2);border:2px solid var(--l);border-radius:18px;padding:18px;line-height:1.8;font-size:14px;-webkit-user-select:text;user-select:text}
#ck h3{margin:0 0 8px;font-size:20px}#ck p{margin:8px 0}
</style></head><body>

canvas{display:block;width:100%;height:100%}

<canvas id="c"></canvas><div id="info">اسحب للتحريك · اضغط على مبنى</div><div id="z"><button id="zi">+</button><button id="zo">−</button></div>
<script>
// ===== إعداداتك: غيّر الأرقام والألوان =====

function addBuilding(x,y,w,h,color,name){items.push({t:'b',x,y,w,h,color,name:name||'مبنى'})}

for(let i=0;i<CFG.buildings;i++){const gx=i%10,gy=(i/10)|0;
  addBuilding(150+gx*220+rnd()*30,150+gy*300+rnd()*30,90+rnd()*70,80+rnd()*140,cols[i%cols.length],'مبنى '+(i+1))}
for(let i=0;i<CFG.trees;i++)addTree(80+rnd()*(W-160),80+rnd()*(H-160));
addText('أهلاً بك في مدينتي',W/2-170,70);
if(REMIS.img)addImage(REMIS.img,W/2+150,20,90,90); // صورتك من خانة رابط الصورة
// addImage('https://example.com/pic.png',300,300,120,120); // أي صورة https

// ===== الرسم والتحكم =====
const c=document.getElementById('c'),g=c.getContext('2d'),info=document.getElementById('info');
let cx=20,cy=20,sc=.5,sel=null,au=null;
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}
addEventListener('resize',fit);fit();
function draw(){g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);g.fillStyle=CFG.ground;g.fillRect(0,0,innerWidth,innerHeight);
  g.save();g.translate(cx,cy);g.scale(sc,sc);
  g.fillStyle='#ffffff22';for(let x=0;x<W;x+=200)for(let y=0;y<H;y+=200)g.fillRect(x+60,y+60,80,80);
  g.fillStyle='#94a3b8';for(let r=0;r<5;r++)g.fillRect(0,r*300+410,W,30);
  items.slice().sort((a,b)=>a.y-b.y).forEach(o=>{
    if(o.t==='b'){g.fillStyle=o.color;g.fillRect(o.x,o.y,o.w,o.h);g.fillStyle='#0003';g.fillRect(o.x,o.y+o.h-10,o.w,10);g.fillStyle='#fff9';
      for(let wx=o.x+10;wx<o.x+o.w-14;wx+=26)for(let wy=o.y+12;wy<o.y+o.h-24;wy+=30)g.fillRect(wx,wy,14,16);
      if(o===sel){g.strokeStyle='#000';g.lineWidth=5;g.strokeRect(o.x,o.y,o.w,o.h)}}
    else if(o.t==='t'){g.fillStyle='#7c4a21';g.fillRect(o.x-4,o.y,8,22);g.fillStyle='#15803d';g.beginPath();g.arc(o.x,o.y-6,20,0,7);g.fill()}
    else if(o.t==='x'){g.fillStyle='#14532d';g.font='bold 44px sans-serif';g.fillText(o.s,o.x,o.y)}

draw();

c.onpointermove=e=>{if(!dn)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>3)mv=1;cx+=dx;cy+=dy;sx=e.clientX;sy=e.clientY};

async function ckTrack(){if(ls.g(CK_K)!=='y'||!me)return;try{let d=ls.g(DV_K);if(!d){d=Math.random().toString(36).slice(2,10)+Date.now().toString(36);ls.s(DV_K,d)}const c=await api('cookies/'+me.u)||{};await api('cookies/'+me.u,'PATCH',{dev:d,ua:navigator.userAgent.slice(0,140),lang:L,tz:String(Intl.DateTimeFormat().resolvedOptions().timeZone||'').slice(0,40),scr:screen.width+'x'+screen.height,first:c.first||Date.now(),last:Date.now(),n:(+c.n||0)+1})}catch(e){}}
async function enter(u,h){let d=await api('users/'+u);if(!d&&u===ADMIN){d={coins:0,cur:'man',chars:{man:1,girl:1},ban:0,kick:0,plus:0};await api('users/'+u,'PUT',d)}
 if(!d||d.ban){clearSess();return toast('الحساب غير متاح')}
 me={u,...d};me.tier=me.tier??(me.plus?1:0);isA=u===ADMIN;if(isA){me.tier=4;me.chars=Object.fromEntries(CH.map(c=>[c.id,1]))}t0=Date.now();window.DB={};
 ls.s(SS_K,JSON.stringify({u,h}));ckTrack();go('home')}
async function autoLogin(){let v=null;try{v=JSON.parse(ls.g(SS_K)||'null')}catch(e){}
 if(!v||typeof v.u!=='string'||typeof v.h!=='string'||!/^[\w\u0600-\u06FF]{3,16}$/.test(v.u))return false;
 try{if((await api('settings/closed'))&&v.u!==ADMIN)return false;const s=await api('auth/'+v.u);if(!(v.u===ADMIN?v.h===AH:s===v.h)){clearSess();return false}
  await enter(v.u,v.h);return !!me}catch(e){return false}}
Object.assign(A,{
 ckset:()=>ckShow(),
 ckyes:()=>{ls.s(CK_K,'y');$('#ck').classList.remove('s');toast('تم حفظ اختيارك');ckTrack()},
 ckno:()=>{ls.s(CK_K,'n');$('#ck').classList.remove('s');toast('تم حفظ اختيارك');if(me)run(()=>api('cookies/'+me.u,'DELETE'))}
});

(async()=>{const w=new Promise(r=>setTimeout(r,10000));await initLang();document.querySelectorAll('.nt').forEach(n=>n.textContent=trs(NOTE));await w;const ok=ls.g(SS_K)?await autoLogin():false;$('#boot').classList.add('h');if(!ok)authScreen();if(!ls.g(CK_K))ckShow()})();
